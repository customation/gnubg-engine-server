name: Diagnose the arm64 evaluateMoves hang

# Where linux-aarch64 stops.
#
# The release gate caught it on 2026-07-31, the first time that platform was
# ever asked to evaluate anything:
#
#   PASS describe
#   PASS evaluatePosition 0ply
#   FAIL evaluateMoves 0ply 3-1: no response to evaluateMoves (id 3)
#   ... everything after: [Errno 32] Broken pipe
#
# Ten minutes elapsed between the daemon announcing itself and the harness
# giving up, so it did not crash -- it HUNG, and the broken pipes are the
# corpse. evaluatePosition passing means the network, the weights and gnubg's
# data files are all fine on ARM; the first thing evaluateMoves reaches that
# evaluatePosition does not is move scoring, and src/engine.rs already records
# what that involves: "gnubg's move scoring (FindnSaveBestMoves) drives
# thread-local task machinery that must run on the initializing thread".
#
# That is a hypothesis, not an answer, so this does not test it -- it asks the
# process. Reproduce the hang, attach gdb, dump every thread's stack. A hung
# thread pool says exactly where it is waiting, which beats reasoning about
# gnubg's multithread.c from a Windows box.
#
# x86 runs alongside as a control: same commands, same timings. It should sail
# past the point ARM stops, which is what makes the ARM stack meaningful rather
# than merely a picture of a busy engine.
#
# Delete once the cause is known and fixed.

on:
  workflow_dispatch:

env:
  ENGINE_ID: gnubg

jobs:
  stack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            runtime: linux-arm64
          - os: ubuntu-latest
            label: linux-x86_64
            runtime: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Check out gnubgapi
        uses: actions/checkout@v4
        with:
          repository: customation/gnubgapi
          path: gnubgapi

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and stage exactly as the release does
        run: |
          cargo build --release
          STAGE="stage/$ENGINE_ID"
          mkdir -p "$STAGE/data"
          cp target/release/gnubg-engine-server "$STAGE/"
          cp gnubgapi/runtimes/${{ matrix.runtime }}/native/* "$STAGE/"
          cp -r gnubgapi/data/. "$STAGE/data/"

      - name: Machine facts
        run: |
          echo "nproc:        $(nproc)"
          echo "arch:         $(uname -m)"
          echo "libc:         $(ldd --version | head -1)"
          # If gnubg's thread count is derived from the CPU count, an ARM runner
          # with a different core count is the first thing worth ruling in.
          echo "--- threading symbols in the engine library ---"
          nm -D "stage/$ENGINE_ID/libgnubgapi.so" 2>/dev/null \
            | grep -iE "pthread|MT_|multithread|Task" | head -20 || echo "  (none listed)"

      - name: Install gdb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb

      # ptrace_scope is 1 on these images, so a non-root gdb cannot attach to a
      # process it did not start. Lower it rather than running the daemon itself
      # under sudo, which would change the thing being measured.
      - name: Allow gdb to attach
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Reproduce, then ask the process where it is
        run: |
          set -u
          STAGE="stage/$ENGINE_ID"

          # The harness drives the same sequence the gate does and stops at the
          # same place. Backgrounded so this step stays in control of the clock.
          timeout 180 python3 tests/e2e/run_e2e.py \
            "$STAGE/gnubg-engine-server" \
            "$STAGE/libgnubgapi.so" \
            "$STAGE/data" > e2e.log 2>&1 &
          HARNESS=$!

          # evaluatePosition answers promptly; evaluateMoves is where ARM stops.
          # 45s is far past the former and far short of the harness timeout.
          sleep 45

          # Matched by EXECUTABLE, not by command line. The process tree here is
          # timeout -> python3 -> gnubg-engine-server, and both ancestors carry
          # the daemon's path in their arguments -- so `pgrep -f` returns the
          # timeout wrapper, which is legitimately parked in sigsuspend waiting
          # for its child. The first version of this file did exactly that and
          # produced a stack that looked like an answer and was not.
          # `pgrep -x` is no good either: Linux truncates comm to 15 characters,
          # so the daemon is "gnubg-engine-se" there.
          PID=""
          for p in /proc/[0-9]*; do
            exe="$(sudo readlink -f "$p/exe" 2>/dev/null || true)"
            case "$exe" in
              */stage/gnubg/gnubg-engine-server) PID="${p#/proc/}"; break ;;
            esac
          done
          if [ -z "$PID" ]; then
            echo "### ${{ matrix.label }}: daemon already gone at 45s" | tee -a "$GITHUB_STEP_SUMMARY"
            wait "$HARNESS" || true
            echo "--- harness output ---"; cat e2e.log
            exit 0
          fi

          echo "--- harness progress so far ---"
          cat e2e.log || true

          echo
          echo "=== all thread stacks for pid $PID (${{ matrix.label }}) ==="
          sudo gdb -p "$PID" -batch \
            -ex "set pagination off" \
            -ex "info threads" \
            -ex "thread apply all bt" 2>&1 | tee gdb.log

          {
            echo "### ${{ matrix.label }}"
            echo
            echo "Threads at 45s into evaluateMoves:"
            echo '```'
            grep -E "^Thread|^#[0-9]+ " gdb.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          kill "$HARNESS" 2>/dev/null || true
          pkill -f gnubg-engine-server 2>/dev/null || true
          # This step's job is to produce a stack, not a verdict. It succeeds if
          # it got one; whether the engine hung is what the stack says.
          exit 0
